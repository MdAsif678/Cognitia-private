# Render Blueprint for the analysis API (free plan).
# Render → New → Blueprint → pick this repository. See docs/DEPLOY.md, step 1.
#
# Deploys are gated on GitHub Actions: with autoDeployTrigger "checksPass", Render deploys a commit
# on main only after its GitHub checks ("MVP checks") succeed. Measured footprint: ~150 MB RAM and ~0.6 CPU-seconds per mainnet
# analysis, which fits the free instance (512 MB, 0.1 CPU). No keys are needed: public RPCs only.
services:
  - type: web
    name: cognitia-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: SIM_CHAINS
        value: "1,11155111"
      # Keyless public upstreams, highest preference first; a rate-limited one is parked and the next is used.
      - key: RPC_URL_1
        value: https://ethereum-rpc.publicnode.com,https://eth.drpc.org,https://1rpc.io/eth
      - key: RPC_URL_11155111
        value: https://ethereum-sepolia-rpc.publicnode.com,https://1rpc.io/sepolia
      - key: CORS_ORIGINS
        value: "*"
      # One fork at a time and no pre-warmed forks: keeps memory well inside 512 MB.
      - key: MAX_CONCURRENT_FORKS
        value: "1"
      - key: WARM_FORKS_PER_CHAIN
        value: "0"
      - key: ANALYSIS_TIMEOUT_MS
        value: "45000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: ENABLE_DEBUG_ROUTES
        value: "false"
      - key: THREAT_INCLUDE_DEMO
        value: "false"
