name: Keep analysis API awake
# Render's free instance sleeps after 15 minutes without traffic and takes about a minute to wake.
# This is a BACKUP ping: GitHub delays scheduled runs when busy (gaps of hours have been observed),
# so the main keep-awake is a free cron-job.org job hitting /health every 10 minutes (docs/DEPLOY.md).
#
# Runs only on public repositories, where Actions minutes are free.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.ANALYSIS_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "ANALYSIS_API_URL is not set; nothing to ping."; exit 0; fi
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 15 "$API_URL/health" > /dev/null
          echo "API awake"
