<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Cognitia · Analysis report</title><link rel="stylesheet" href="style.css"/></head>
<body><main class="container report-page"><a class="btn btn-ghost" href="index.html">← Back to testbed</a><div id="report"><h1>No analysis yet</h1><p>Run a testbed scenario to see its actual risk report here.</p></div><button id="download-report" class="btn btn-primary" hidden>Download report JSON</button></main>
<script type="module">
import { renderReport } from './report.mjs';
try {
  const saved = JSON.parse(sessionStorage.getItem('cognitia:last-report') || 'null');
  if (saved?.report) {
    renderReport(document.getElementById('report'), saved.report);
    const button = document.getElementById('download-report'); button.hidden = false;
    button.onclick = () => { const url = URL.createObjectURL(new Blob([JSON.stringify(saved, null, 2)], { type: 'application/json' })); const link = document.createElement('a'); link.href = url; link.download = 'cognitia-report.json'; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  }
} catch { document.getElementById('report').textContent = 'Stored report is invalid. Run the scenario again.'; }
</script></body></html>
